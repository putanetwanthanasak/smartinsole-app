; SmartInsole BLE simulator — see README.md.
;
;   pio run -e left -e right        build both feet
;   pio run -e left -t upload       flash the left foot
;   pio test -e native              host tests (encoders vs shared/test_vectors/)
;
; The upload/monitor port is matched by USB id so it can only ever pick the
; CP2102 bridge, never the laptop's LTE modem (also a ttyUSB device).

[platformio]
default_envs = left, right

[esp32_base]
platform = platformio/espressif32@7.1.3
board = esp32dev
framework = arduino
lib_deps = h2zero/NimBLE-Arduino@2.5.1
monitor_speed = 115200
upload_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102*
monitor_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102*
build_flags =
    -DFSR_COUNT=6
    -DCORE_DEBUG_LEVEL=1

[env:left]
extends = esp32_base
build_flags = ${esp32_base.build_flags} -DFOOT_SIDE=0

[env:right]
extends = esp32_base
build_flags = ${esp32_base.build_flags} -DFOOT_SIDE=1

; Build-only check that a non-default FSR count compiles (BACKLOG 15: N != 6
; is not in the Data Contract yet). Not meant to be flashed for the app.
[env:left_fsr8]
extends = esp32_base
build_flags = -DCORE_DEBUG_LEVEL=1 -DFOOT_SIDE=0 -DFSR_COUNT=8

; Host tests of lib/insole_core only; src/ (Arduino + NimBLE) is not built.
[env:native]
platform = native
build_src_filter = -<*>
lib_deps = bblanchon/ArduinoJson@7.4.3
test_build_src = no
build_flags =
    -std=gnu++17
    -DUNITY_INCLUDE_DOUBLE
    -DVECTORS_DIR=\"${PROJECT_DIR}/../../shared/test_vectors\"
