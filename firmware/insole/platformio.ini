; SmartInsole firmware for the real insole boards (FW-1, report 043; see
; README.md). ESP32-C3 + 16-channel mux (8 FSR) + MPU6050. The BLE wire
; format comes from the simulator's tested core (../simulator/lib/insole_core,
; used read-only through lib_extra_dirs); firmware/simulator is not changed.
;
;   pio test -e native                   host tests (no board)
;   pio run -e buildcheck                compile for the C3 with placeholder pins
;   INSOLE_UPLOAD_PORT=/dev/serial/by-id/usb-Espressif_..._<MAC>-if00 \
;       pio run -e right -t upload       flash (only with the user's go-ahead)
;
; The upload port is never written in this file: the by-id name carries the
; chip's MAC and this repo is public. tools/upload_guard.py refuses any
; upload that isn't to a /dev/serial/by-id/usb-Espressif_* port (never the
; laptop's Quectel modem, never auto-detected) and any upload of buildcheck.

[platformio]
default_envs = buildcheck

[c3_base]
platform = platformio/espressif32@7.1.3
board = esp32-c3-devkitm-1
framework = arduino
lib_extra_dirs = ../simulator/lib
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
    bblanchon/ArduinoJson@7.4.3
monitor_speed = 115200
upload_port = ${sysenv.INSOLE_UPLOAD_PORT}
monitor_port = ${sysenv.INSOLE_UPLOAD_PORT}
extra_scripts = pre:tools/upload_guard.py
; C++17 as the host tests (constexpr checks in config.h and lib/insole_hw).
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DFSR_COUNT=8

; Flash these. They do not compile until config.h has the hardware team's
; pin map (PINMAP_FILLED_IN), so a guessed pin can never reach a board.
[env:right]
extends = c3_base
build_flags = ${c3_base.build_flags} -DFOOT_SIDE=1

[env:left]
extends = c3_base
build_flags = ${c3_base.build_flags} -DFOOT_SIDE=0

; Compile and link check with placeholder pins. Never flashed: the guard
; refuses it, and its setup() halts before touching any pin or the radio.
[env:buildcheck]
extends = c3_base
build_flags = ${c3_base.build_flags} -DFOOT_SIDE=1 -DFW1_BUILD_CHECK=1

; Host tests of lib/insole_hw (and the simulator core it builds on).
[env:native]
platform = native
build_src_filter = -<*>
lib_extra_dirs = ../simulator/lib
lib_deps = bblanchon/ArduinoJson@7.4.3
test_build_src = no
build_flags =
    -std=gnu++17
    -DUNITY_INCLUDE_DOUBLE
    -DVECTORS_DIR=\"${PROJECT_DIR}/../../shared/test_vectors\"
